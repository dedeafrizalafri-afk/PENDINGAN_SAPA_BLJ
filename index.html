<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <style>
        :root {
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --text: #1a1d20;
            --primary: #0d6efd;
            --border: #e3e6ea;
            --code-bg: #eef2f7;
            --code-color: #d63384;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.5;
            padding: 2rem 1rem;
        }

        .container { max-width: 1000px; margin: 0 auto; }

        header {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 2rem;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.03);
        }

        h1 { font-size: 2rem; color: var(--text); margin-bottom: 0.5rem; }
        .subtitle { color: #6c757d; font-size: 1rem; }

        .section-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        h2 {
            font-size: 1.35rem;
            color: var(--primary);
            border-bottom: 2px solid var(--border);
            padding-bottom: 0.5rem;
            margin-bottom: 1rem;
        }

        details {
            border: 1px solid var(--border);
            border-radius: 6px;
            margin-bottom: 0.75rem;
            background: #fafbfc;
            overflow: hidden;
        }

        details[open] { background: #ffffff; }

        summary {
            font-weight: 600;
            padding: 0.85rem 1rem;
            cursor: pointer;
            user-select: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background-color 0.2s;
        }

        summary:hover { background-color: #f0f3f6; }

        ul { list-style: none; padding: 0.5rem 1rem 1rem 1.5rem; }

        li {
            font-size: 0.9rem;
            padding: 0.35rem 0;
            border-bottom: 1px dashed var(--border);
            display: flex;
            align-items: center;
        }

        li:last-child { border-bottom: none; }

        code {
            background: var(--code-bg);
            color: var(--code-color);
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-family: "SFMono-Regular", Consolas, monospace;
            font-size: 0.82rem;
            margin-right: 0.75rem;
            font-weight: bold;
            min-width: 50px;
            display: inline-block;
        }
    </style>
</head>
<body>

    const mainContainer = document.getElementById('main-content');

    taxonomy.forEach((cat) => {
        const sec = document.createElement('div');
        sec.className = 'section-card';

        let secHTML = `<h2>${cat.title}</h2>`;
        const itemsPerSub = cat.count / cat.subcategories.length;

        cat.subcategories.forEach((subName, subIdx) => {
            secHTML += `<details ${subIdx === 0 ? 'open' : ''}>`;
            secHTML += `<summary>${subName}</summary><ul>`;

            const subStart = cat.start + (subIdx * itemsPerSub);
            
            for (let i = 0; i < itemsPerSub; i++) {
                const currentNum = subStart + i;
                const formattedNum = String(currentNum).padStart(4, '0');
                
                let featureText = "";
                if (i < cat.samples.length) {
                    featureText = cat.samples[i];
                } else {
                    featureText = `Modul Spesifikasi Teknis & Parameter Fitur ${cat.title.split(' ')[1]} Sub-${subIdx + 1} Variasi-${i + 1}`;
                }

                secHTML += `<li><code>${formattedNum}</code> ${featureText}</li>`;
            }

            secHTML += `</ul></details>`;
        });

        sec.innerHTML = secHTML;
        mainContainer.appendChild(sec);
    });
</script>

</html>
